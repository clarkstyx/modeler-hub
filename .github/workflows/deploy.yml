name: Pull modelers, build, deploy

# Runs on every push to main, nightly, and by hand. Each run clones every
# modeler repo at its latest commit, builds it, and deploys the whole site to
# Cloudflare Pages. To trigger it from a modeler repo, add a step there that
# calls `repository_dispatch` with event_type "modeler-updated".
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [modeler-updated]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the repository secrets are set
        # Without these the run cannot clone the private modeler repos or deploy.
        # Fails early with the names of what is missing instead of a git error.
        env:
          MODELER_PAT: ${{ secrets.MODELER_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$MODELER_PAT" ] || missing="$missing MODELER_PAT"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in this repo's Settings > Secrets and variables > Actions (MANUAL.md step 1.4), then re-run this workflow."
            exit 1
          fi
          echo "All three secrets are set."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Pull and build every modeler
        env:
          MODELER_PAT: ${{ secrets.MODELER_PAT }}
        run: npm run pull
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name modeler-hub
